<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        width: 340px; margin: 0; padding: 14px; font-size: 13px;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .item { border-bottom: 1px solid var(--border); padding: 8px 0; display: flex; gap: 8px; align-items: flex-start; }
      .item .t { flex: 1; min-width: 0; }
      .item .t b { display: block; font-weight: 600; }
      .item .t span { color: var(--muted-foreground); font-size: 11px; }
      .item input { width: 46px; padding: 3px; }
      .item button { height: auto; padding: 0 4px; border: none; background: none; color: var(--muted-foreground); font-size: 15px; }
      .item button:hover { color: var(--foreground); background: none; }
      .row { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
      select { flex: 1; padding: 5px; }
      .actions { display: flex; gap: 6px; margin-top: 12px; }
      button.act { flex: 1; padding: 0 8px; }
      .empty { color: var(--muted-foreground); padding: 18px 0; text-align: center; }
      a { color: var(--muted-foreground); font-size: 11px; }
      /* 赤はエラー専用。設定未入力の案内に使う */
      #status { color: var(--destructive); font-size: 12px; margin-top: 8px; }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <h1>まとめ注文リスト</h1>
    <div id="list"></div>
    <div class="row"><label for="dest">注文先</label><select id="dest"></select></div>
    <div class="row" id="funding-row">
      <label for="funding">支払</label>
      <select id="funding">
        <option value="research">研究費</option>
        <option value="private">私費</option>
      </select>
      <select id="source"></select>
    </div>
    <div class="actions">
      <button class="act primary" id="mail">1通にまとめてメール</button>
      <button class="act" id="copy">コピー</button>
    </div>
    <div class="actions"><button class="act" id="clear">リストを空にする</button></div>
    <div id="status" aria-live="polite"></div>
    <div style="margin-top: 10px"><a href="#" id="opt">設定</a></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
