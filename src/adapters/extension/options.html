<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>地元で買う — 設定</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        max-width: 720px;
        margin: 32px auto 64px;
        padding: 0 20px;
        color: #111827;
        line-height: 1.6;
      }
      h1 { font-size: 20px; }
      h2 { font-size: 15px; margin-top: 32px; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; }
      p.hint { color: #6b7280; font-size: 13px; margin-top: -4px; }
      label { display: block; margin-top: 12px; font-size: 13px; color: #374151; }
      input, select, textarea {
        width: 100%; padding: 7px 9px; margin-top: 3px; font: inherit; font-size: 14px;
        border: 1px solid #cbd5e1; border-radius: 7px; background: #fff;
      }
      textarea { min-height: 76px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
      .src { border: 1px solid #e5e7eb; border-radius: 9px; padding: 10px 14px 16px; margin-top: 12px; }
      button { font: inherit; padding: 8px 16px; border-radius: 999px; border: 1px solid #cbd5e1; background: #f8fafc; cursor: pointer; }
      button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
      .bar { position: sticky; bottom: 0; background: #fff; padding: 14px 0; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: center; margin-top: 28px; }
      #status { color: #15803d; font-size: 13px; }
      details { margin-top: 12px; }
      summary { cursor: pointer; font-size: 13px; color: #4b5563; }
    </style>
  </head>
  <body>
    <h1>地元で買う — 設定</h1>
    <p class="hint">
      入力内容はこの端末のブラウザ内にのみ保存されます。外部には送信されません。
    </p>

    <h2>依頼者</h2>
    <div class="grid">
      <label>氏名<input id="req-name" placeholder="古川 由己" /></label>
      <label>ふりがな<input id="req-kana" /></label>
    </div>
    <label>所属<input id="req-affiliation" placeholder="○○大学 医学部 精神医学教室" /></label>
    <div class="grid">
      <label>メールアドレス<input id="req-email" type="email" /></label>
      <label>電話番号<input id="req-phone" /></label>
    </div>
    <label>配達場所<input id="req-delivery" placeholder="医学部本館 3F 305号室" /></label>

    <h2>大学生協</h2>
    <p class="hint">書籍部・外商担当の受付メールアドレスを入れてください。</p>
    <div class="grid">
      <label>表示名<input id="coop-label" /></label>
      <label>受取店舗<input id="coop-store" /></label>
    </div>
    <div class="grid">
      <label>宛先メール<input id="coop-to" type="email" /></label>
      <label>CC<input id="coop-cc" /></label>
    </div>
    <div class="grid">
      <label>受取方法<input id="coop-receive" placeholder="研究室へ配達" /></label>
      <label>組合員番号<input id="coop-member" /></label>
    </div>

    <h2>地元書店</h2>
    <div class="grid">
      <label>店名<input id="bs-store" placeholder="○○書店" /></label>
      <label>宛先メール<input id="bs-to" type="email" /></label>
    </div>
    <div class="grid">
      <label>受取方法<input id="bs-receive" placeholder="店頭受取" /></label>
      <label>会員番号<input id="bs-customer" /></label>
    </div>

    <h2>研究費の財源</h2>
    <p class="hint">複数登録できます。注文時に選択します。</p>
    <div id="sources"></div>
    <button id="add-source" type="button" style="margin-top: 10px">財源を追加</button>

    <h2>既定値</h2>
    <div class="grid">
      <label>注文先
        <select id="def-route">
          <option value="coop">大学生協</option>
          <option value="bookstore">地元書店</option>
        </select>
      </label>
      <label>支払区分
        <select id="def-funding">
          <option value="research">研究費</option>
          <option value="private">私費</option>
        </select>
      </label>
    </div>

    <details>
      <summary>文面テンプレート（大学生協ごとの決まり文句を差し替える）</summary>
      <label>生協・件名<input id="tpl-coop-subject" /></label>
      <label>生協・書き出し<textarea id="tpl-coop-greeting"></textarea></label>
      <label>生協・結び<textarea id="tpl-coop-closing"></textarea></label>
      <label>書店・件名<input id="tpl-bs-subject" /></label>
      <label>書店・書き出し<textarea id="tpl-bs-greeting"></textarea></label>
      <label>書店・結び<textarea id="tpl-bs-closing"></textarea></label>
      <label>公費フォーム備考欄の1行<input id="tpl-remarks" /></label>
    </details>

    <div class="bar">
      <button class="primary" id="save" type="button">保存</button>
      <span id="status"></span>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
