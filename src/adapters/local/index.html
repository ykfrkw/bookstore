<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>地元で買う — ローカル版</title>
    <style>
      /* shadcn/ui (zinc) 風トークン。ローカル版は 1 ファイル完結を維持するためここに定義。
         primary は既存ブランド色（ブルー）を維持。赤（--destructive）はエラー表示専用。 */
      :root {
        color-scheme: light dark;
        --background: #fff;
        --foreground: #09090b;
        --card: #fff;
        --border: #e4e4e7;
        --input: #e4e4e7;
        --primary: #1f6feb;
        --primary-foreground: #fff;
        --muted-foreground: #71717a;
        --accent: #f4f4f5;
        --destructive: #dc2626;
        --ring: #1f6feb;
        --radius: 0.5rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #09090b;
          --foreground: #fafafa;
          --card: #09090b;
          --border: #27272a;
          --input: #27272a;
          --muted-foreground: #a1a1aa;
          --accent: #27272a;
          --destructive: #ef4444;
          --ring: #3b82f6;
        }
      }
      body {
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        max-width: 800px; margin: 32px auto 80px; padding: 0 20px; line-height: 1.6;
        background: var(--background); color: var(--foreground);
      }
      h1 { font-size: 20px; }
      h2 { font-size: 15px; margin-top: 28px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
      p.hint { color: var(--muted-foreground); font-size: 13px; margin-top: -2px; }
      label { display: block; margin-top: 10px; font-size: 13px; }
      input, select, textarea {
        width: 100%; padding: 7px 9px; margin-top: 3px; font: inherit; font-size: 14px;
        border: 1px solid var(--input); border-radius: 6px; background: var(--background); color: var(--foreground);
      }
      textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
      .row { display: flex; gap: 8px; align-items: flex-end; }
      /* ボタン: 既定は outline、primary は塗り */
      button {
        font: inherit; font-weight: 500; height: 36px; padding: 0 16px;
        border-radius: var(--radius); border: 1px solid var(--input);
        background: var(--background); color: var(--foreground); cursor: pointer;
      }
      button:hover { background: var(--accent); }
      button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
      button.primary:hover { background: #1a5fd0; border-color: #1a5fd0; }
      /* キーボード操作時のみリングを出す */
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
        outline: 2px solid var(--ring); outline-offset: 2px;
      }
      .item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
      .item .t { flex: 1; min-width: 0; }
      .item .t b { display: block; }
      .item .t span { color: var(--muted-foreground); font-size: 12px; }
      .item input { width: 64px; }
      /* 赤はエラー専用色 */
      .bad { color: var(--destructive); font-size: 13px; }
      /* 赤はエラー専用。エラーでない案内（簡略版で開いた・コピーした）は muted で出す */
      .info { color: var(--muted-foreground); font-size: 13px; }
      /* 宛先・財源は 1 件 = 1 カード（拡張の設定画面と同じ見た目に揃える） */
      .card {
        border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); padding: 10px 14px 16px; margin-top: 12px;
      }
      details summary { cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 24px; }
      .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <h1>地元で買う — ローカル版</h1>
    <p class="hint">
      Chrome 拡張と同じ core をそのまま使います。Amazon の URL でも ISBN でも、
      1 行に 1 件ずつ貼り付けてください。設定はこのブラウザの localStorage に保存されます。
    </p>

    <h2>1. 書籍を入れる</h2>
    <label>
      Amazon URL / ISBN（複数行可）
      <textarea id="input" rows="5" placeholder="https://www.amazon.co.jp/dp/4000612344&#10;978-4-00-061234-5"></textarea>
    </label>
    <div class="actions">
      <button class="primary" id="lookup">書誌を取得</button>
      <button id="clear">クリア</button>
    </div>
    <div id="errors" class="bad"></div>
    <div id="list"></div>

    <h2>2. 注文先</h2>
    <div class="grid">
      <label>注文先<select id="dest"></select></label>
      <label>支払区分<select id="funding"><option value="research">研究費</option><option value="private">私費</option></select></label>
    </div>
    <label id="source-wrap">財源<select id="source"></select></label>
    <label>ひとこと添える（任意）<input id="message" /></label>

    <div class="actions">
      <button class="primary" id="compose">注文メールを作る</button>
      <button id="mailto">メーラーで開く</button>
      <button id="copy">コピー</button>
      <button id="copy-remarks">備考欄の1行をコピー</button>
    </div>

    <label>件名<input id="out-subject" readonly /></label>
    <label>本文<textarea id="out-body" rows="22"></textarea></label>

    <details>
      <summary>設定</summary>
      <div class="grid">
        <label>氏名<input data-p="requester.name" placeholder="山田 太郎" /></label>
        <label>ふりがな<input data-p="requester.kana" placeholder="やまだ たろう" /></label>
      </div>
      <label>所属<input data-p="requester.affiliation" placeholder="○○大学 △△学部 ××研究室" /></label>
      <div class="grid">
        <label>メール<input data-p="requester.email" /></label>
        <label>電話<input data-p="requester.phone" /></label>
      </div>
      <label>配達場所<input data-p="requester.deliveryPlace" placeholder="△△棟 3F 305号室" /></label>

      <h2>宛先</h2>
      <p class="hint">
        生協・書店をまとめて何件でも登録できます。生協を選んだときだけ研究費・財源の指定が出ます。
      </p>
      <div id="destinations"></div>
      <div class="actions"><button id="add-dest" type="button">宛先を追加</button></div>

      <h2>研究費の財源</h2>
      <div id="fs-list"></div>
      <div class="actions"><button id="add-fs" type="button">財源を追加</button></div>

      <h2>既定値</h2>
      <div class="grid">
        <label>既定の宛先<select id="def-dest"></select></label>
        <label>既定の支払区分
          <select id="def-funding">
            <option value="research">研究費</option>
            <option value="private">私費</option>
          </select>
        </label>
      </div>

      <div class="actions"><button class="primary" id="save">設定を保存</button><span id="saved"></span></div>
    </details>

    <script type="module" src="app.js"></script>
  </body>
</html>
